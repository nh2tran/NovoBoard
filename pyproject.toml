[project]
name = "novoboard"
version = "0.1.0"
description = "Framework for evaluating de novo peptide sequencing"
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.86",
    "gdown>=5.0",
    "matplotlib>=3.8",
    "matplotlib-venn>=1.1.2",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "seaborn>=0.13.2",
]

[project.scripts]
novoboard = "novoboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novoboard"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=8.0",
]
